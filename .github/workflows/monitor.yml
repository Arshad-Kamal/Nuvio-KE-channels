# Probes the pool and commits monitor/state.tsv and monitor/cursor (harvest/monitor.py; Nuvio-Project Spec 71).
# Free and unlimited here on standard runners; never a larger runner (they bill even in public repos).
name: Monitor

on:
  # D5: twice a day 12 h apart, the pair 3 h later each day over a 4-day cycle (every 3-hour UTC slot every 4 days)
  schedule:
    - cron: '17 0,12 1,5,9,13,17,21,25,29 * *'
    - cron: '17 3,15 2,6,10,14,18,22,26,30 * *'
    - cron: '17 6,18 3,7,11,15,19,23,27,31 * *'
    - cron: '17 9,21 4,8,12,16,20,24,28 * *'
  workflow_dispatch:
    inputs:
      budget:
        description: Seconds after which no probe starts (empty = the scheduled value)
        type: number
      lookups:
        description: DNS lookups at once (empty = the scheduled value)
        type: number
      commit:
        description: Commit the state (off for a measuring run, which then leaves the cursor where it was)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # just above the budget; a killed run commits nothing
    permissions:
      contents: write
    steps:
      # no token on disk while probes read untrusted answers: commit_state.sh gets it for the push alone
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main  # the tip when the job starts: a run queued behind another reads its state
          persist-credentials: false
      - name: Probe
        env:
          BUDGET: ${{ inputs.budget || 900 }}  # a whole lap took 324 s (Spec 71 M1.3); FAST samples can hang ~500 s
          LOOKUPS: ${{ inputs.lookups || 8 }}
        run: python3 harvest/monitor.py . --budget="$BUDGET" --lookups="$LOOKUPS"
      - name: Commit
        if: github.event_name != 'workflow_dispatch' || inputs.commit
        env:
          TOKEN: ${{ github.token }}
        run: sh harvest/commit_state.sh .
